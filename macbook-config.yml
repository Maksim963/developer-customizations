---
- name: Setup Development Environment
  hosts: localhost
  become: no

  vars:
    brew_taps:
      - hookdeck/hookdeck
      - porter-dev/porter

    brew_packages:
      - rustup
      - go
      - opencode
      - ocaml
      - opam
      - tfenv
      - zsh-autocomplete
      - awscli
      - dune
      - llvm
      - scmpuff
      - fzf
      - zoxide
      - neovim
      - coreutils
      - gh
      - git-lfs
      - docker
      - helm
      - deno
      - nvm
      - libpq
      - poetry
      - python@3.11
      - openjdk@21
      - ffmpeg
      - poppler
      - mkcert
      - trufflehog
      - watch
      - displayplacer
      - gemini-cli
      - hookdeck/hookdeck/hookdeck
      - porter-dev/porter/porter

    cask_apps:
      - { name: "MiddleClick", cask: "middleclick" }
      - { name: "DBeaver", cask: "dbeaver-community" }
      - { name: "Rectangle", cask: "rectangle" }
      - { name: "Raycast", cask: "raycast" }
      - { name: "ClickHouse", cask: "clickhouse" }
      - { name: "Ghostty", cask: "ghostty" }
      - { name: "ngrok", cask: "ngrok" }
      - { name: "Miniconda", cask: "miniconda" }
      - { name: "MediaInfo", cask: "mediainfo" }
      - { name: "mitmproxy", cask: "mitmproxy" }
      - { name: "Session Manager Plugin", cask: "session-manager-plugin" }
      - { name: "Docker", cask: "docker-desktop" }
      - { name: "1Password", cask: "1password" }
      - { name: "Google Chrome", cask: "google-chrome" }
      - { name: "Slack", cask: "slack" }
      - { name: "Notion", cask: "notion" }
      - { name: "Obsidian", cask: "obsidian" }
      - { name: "Granola", cask: "granola" }
      - { name: "Superhuman", cask: "superhuman" }
      - { name: "Spotify", cask: "spotify" }
      - { name: "CleanShot X", cask: "cleanshot" }
      - { name: "Tailscale", cask: "tailscale-app" }
      - { name: "UTM", cask: "utm" }

    ai_tool_casks:
      - claude
      - claude-code@latest
      - chatgpt
      - conductor
      - codex
      - codex-app
      - opencode-desktop

    raycast_defaults:
      global_hotkey: "Command-49"
      preferred_window_mode: "default"
      follow_system_appearance: true
      use_hyper_key_icon: false

    macos_defaults:
      dock:
        - { domain: "com.apple.dock", key: "autohide", type: "bool", value: true }
        - { domain: "com.apple.dock", key: "orientation", type: "string", value: "right" }
        - { domain: "com.apple.dock", key: "tilesize", type: "int", value: 38 }
        - { domain: "com.apple.dock", key: "minimize-to-application", type: "bool", value: true }
      finder:
        - { domain: "com.apple.finder", key: "AppleShowAllFiles", type: "bool", value: true }
        - { domain: "NSGlobalDomain", key: "AppleShowAllExtensions", type: "bool", value: true }
        - { domain: "com.apple.finder", key: "FXPreferredViewStyle", type: "string", value: "Nlsv" }
      trackpad_mouse:
        - { domain: "com.apple.AppleMultitouchTrackpad", key: "Clicking", type: "int", value: 0 }
        - { domain: "com.apple.driver.AppleBluetoothMultitouch.trackpad", key: "Clicking", type: "int", value: 0 }
        - { domain: "com.apple.AppleMultitouchTrackpad", key: "TrackpadRightClick", type: "int", value: 1 }
        - { domain: "com.apple.driver.AppleBluetoothMultitouch.trackpad", key: "TrackpadRightClick", type: "int", value: 1 }
        - { domain: "NSGlobalDomain", key: "com.apple.mouse.scaling", type: "float", value: 1 }
        - { domain: "NSGlobalDomain", key: "com.apple.trackpad.scaling", type: "float", value: 0.6875 }
        - { domain: "NSGlobalDomain", key: "com.apple.swipescrolldirection", type: "int", value: 0 }
        - { domain: "com.apple.AppleMultitouchTrackpad", key: "TrackpadThreeFingerDrag", type: "int", value: 0 }
        - { domain: "com.apple.driver.AppleBluetoothMultitouch.trackpad", key: "TrackpadThreeFingerDrag", type: "int", value: 0 }
      keyboard:
        - { domain: "NSGlobalDomain", key: "NSAutomaticSpellingCorrectionEnabled", type: "bool", value: false }
        - { domain: "NSGlobalDomain", key: "NSAutomaticCapitalizationEnabled", type: "bool", value: false }
        - { domain: "NSGlobalDomain", key: "NSAutomaticPeriodSubstitutionEnabled", type: "bool", value: true }
      appearance:
        - { domain: "NSGlobalDomain", key: "AppleInterfaceStyle", type: "string", value: "Dark" }
      rectangle:
        - { domain: "com.knollsoft.Rectangle", key: "alternateDefaultShortcuts", type: "bool", value: true }
        - { domain: "com.knollsoft.Rectangle", key: "allowAnyShortcut", type: "bool", value: true }
        - { domain: "com.knollsoft.Rectangle", key: "subsequentExecutionMode", type: "int", value: 1 }

    cursor_extensions:
      - 4ops.terraform
      - alefragnani.bookmarks
      - anthropic.claude-code
      - anysphere.cursorpyright
      - bradlc.vscode-tailwindcss
      - bungcip.better-toml
      - cstuder.gitlab-ci-validator
      - dart-code.dart-code
      - dart-code.flutter
      - dbaeumer.vscode-eslint
      - donjayamanne.python-environment-manager
      - donjayamanne.python-extension-pack
      - dustypomerleau.rust-syntax
      - emeryberger.scalene
      - esbenp.prettier-vscode
      - github.copilot
      - github.copilot-chat
      - github.vscode-github-actions
      - gitlab.gitlab-workflow
      - golang.go
      - google.gemini-cli-vscode-ide-companion
      - hashicorp.terraform
      - inferrinizzard.prettier-sql-vscode
      - james-yu.latex-workshop
      - jasonn-porch.gitlab-mr
      - jcbuisson.vue
      - juanblanco.solidity
      - kevinrose.vsc-python-indent
      - mgmcdermott.vscode-language-babel
      - mitaki28.vscode-clang
      - modular-mojotools.vscode-mojo
      - ms-azuretools.vscode-docker
      - ms-kubernetes-tools.vscode-kubernetes-tools
      - ms-playwright.playwright
      - ms-python.black-formatter
      - ms-python.debugpy
      - ms-python.python
      - ms-toolsai.jupyter
      - ms-toolsai.jupyter-keymap
      - ms-toolsai.jupyter-renderers
      - ms-toolsai.vscode-jupyter-cell-tags
      - ms-toolsai.vscode-jupyter-slideshow
      - ms-vscode-remote.remote-containers
      - ms-vscode-remote.remote-ssh
      - ms-vscode-remote.remote-ssh-edit
      - ms-vscode-remote.remote-wsl
      - ms-vscode-remote.vscode-remote-extensionpack
      - ms-vscode.cmake-tools
      - ms-vscode.cpptools
      - ms-vscode.cpptools-extension-pack
      - ms-vscode.cpptools-themes
      - ms-vscode.remote-explorer
      - ms-vscode.remote-server
      - njpwerner.autodocstring
      - nrw.vscode-protolint-nrw
      - ocamllabs.ocaml-platform
      - panicbit.cargo
      - peterj.proto
      - prisma.prisma
      - redhat.ansible
      - redhat.vscode-yaml
      - rust-lang.rust-analyzer
      - rvest.vs-code-prettier-eslint
      - serayuzgur.crates
      - shd101wyy.markdown-preview-enhanced
      - stagewise.stagewise-vscode-extension
      - streetsidesoftware.code-spell-checker
      - svelte.svelte-vscode
      - tamasfe.even-better-toml
      - tim-koehler.helm-intellisense
      - tobermory.es6-string-html
      - vadimcn.vscode-lldb
      - vintharas.learn-vim
      - visualstudioexptteam.intellicode-api-usage-examples
      - visualstudioexptteam.vscodeintellicode
      - vue.volar
      - waderyan.gitblame
      - wholroyd.jinja
      - william-voyek.vscode-nginx
      - xaver.clang-format
      - ziglang.vscode-zig
      - zxh404.vscode-proto3

  tasks:
    - name: Install oh-my-zsh
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: ~/.oh-my-zsh
        update: no

    - name: Install oh-my-zsh custom plugins
      ansible.builtin.git:
        repo: "https://github.com/zsh-users/{{ item }}.git"
        dest: "~/.oh-my-zsh/custom/plugins/{{ item }}"
        update: no
      loop:
        - zsh-autosuggestions
        - zsh-syntax-highlighting

    - name: Ensure .zshrc exists
      ansible.builtin.file:
        path: ~/.zshrc
        state: touch

    - name: Append custom configurations to .zshrc
      ansible.builtin.blockinfile:
        path: ~/.zshrc
        block: "{{ lookup('file', 'config/zshrc-appends.sh') }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Custom commands"
        insertafter: EOF

    - name: Add Homebrew taps
      community.general.homebrew_tap:
        name: "{{ brew_taps }}"
        state: present

    - name: Install Homebrew packages
      community.general.homebrew:
        name: "{{ brew_packages }}"
        state: present

    - name: Validate cask entries shape
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.cask is defined
        fail_msg: "Each cask_apps item must include both 'name' and 'cask'. Bad item: {{ item }}"
      loop: "{{ cask_apps }}"

    - name: Check for existing cask applications
      ansible.builtin.stat:
        path: "/Applications/{{ item.name }}.app"
      register: app_check
      loop: "{{ cask_apps }}"

    - name: Install Homebrew cask packages
      community.general.homebrew_cask:
        name: "{{ item.item.cask }}"
        state: present
        greedy: false
      when: not item.stat.exists
      loop: "{{ app_check.results }}"
      register: cask_install_result

    - name: Install AI tool casks
      community.general.homebrew_cask:
        name: "{{ item }}"
        state: present
        greedy: false
      loop: "{{ ai_tool_casks }}"

    - name: Configure Raycast global hotkey
      community.general.osx_defaults:
        domain: com.raycast.macos
        key: raycastGlobalHotkey
        type: string
        value: "{{ raycast_defaults.global_hotkey }}"

    - name: Configure Raycast preferred window mode
      community.general.osx_defaults:
        domain: com.raycast.macos
        key: raycastPreferredWindowMode
        type: string
        value: "{{ raycast_defaults.preferred_window_mode }}"

    - name: Configure Raycast follow system appearance
      community.general.osx_defaults:
        domain: com.raycast.macos
        key: raycastShouldFollowSystemAppearance
        type: bool
        value: "{{ raycast_defaults.follow_system_appearance }}"

    - name: Configure Raycast hyper key icon preference
      community.general.osx_defaults:
        domain: com.raycast.macos
        key: useHyperKeyIcon
        type: bool
        value: "{{ raycast_defaults.use_hyper_key_icon }}"

    ##################################################
    #              macOS UI Settings                 #
    ##################################################

    - name: Apply Dock defaults
      community.general.osx_defaults:
        domain: "{{ item.domain }}"
        key: "{{ item.key }}"
        type: "{{ item.type }}"
        value: "{{ item.value }}"
      loop: "{{ macos_defaults.dock }}"

    - name: Apply Finder defaults
      community.general.osx_defaults:
        domain: "{{ item.domain }}"
        key: "{{ item.key }}"
        type: "{{ item.type }}"
        value: "{{ item.value }}"
      loop: "{{ macos_defaults.finder }}"

    - name: Apply trackpad and mouse defaults
      community.general.osx_defaults:
        domain: "{{ item.domain }}"
        key: "{{ item.key }}"
        type: "{{ item.type }}"
        value: "{{ item.value }}"
      loop: "{{ macos_defaults.trackpad_mouse }}"

    - name: Apply keyboard defaults
      community.general.osx_defaults:
        domain: "{{ item.domain }}"
        key: "{{ item.key }}"
        type: "{{ item.type }}"
        value: "{{ item.value }}"
      loop: "{{ macos_defaults.keyboard }}"

    - name: Apply appearance defaults
      community.general.osx_defaults:
        domain: "{{ item.domain }}"
        key: "{{ item.key }}"
        type: "{{ item.type }}"
        value: "{{ item.value }}"
      loop: "{{ macos_defaults.appearance }}"

    - name: Apply Rectangle defaults
      community.general.osx_defaults:
        domain: "{{ item.domain }}"
        key: "{{ item.key }}"
        type: "{{ item.type }}"
        value: "{{ item.value }}"
      loop: "{{ macos_defaults.rectangle }}"

    - name: Disable Spotlight keyboard shortcuts
      ansible.builtin.shell: defaults write com.apple.symbolichotkeys AppleSymbolicHotKeys -dict-add {{ item.id }} "{{ item.value }}"
      args:
        executable: /bin/zsh
      loop:
        - { id: "64", value: "{ enabled = 0; value = { parameters = (65535, 49, 1048576); type = standard; }; }" }
        - { id: "65", value: "{ enabled = 0; value = { parameters = (65535, 49, 1572864); type = standard; }; }" }
      changed_when: false

    - name: Restart Dock to apply settings
      ansible.builtin.command: killall Dock
      changed_when: false
      failed_when: false

    - name: Restart Finder to apply settings
      ansible.builtin.command: killall Finder
      changed_when: false
      failed_when: false

    - name: Restart SystemUIServer to apply keyboard shortcut changes
      ansible.builtin.command: killall SystemUIServer
      changed_when: false
      failed_when: false

    ##################################################
    #            Languages Setup                     #
    ##################################################

    - name: Install stable Rust toolchain
      ansible.builtin.command: /opt/homebrew/opt/rustup/bin/rustup default stable
      args:
        creates: ~/.rustup/toolchains

    - name: Add Rust to PATH in .zshrc
      ansible.builtin.lineinfile:
        path: ~/.zshrc
        line: "export PATH=$PATH:$HOME/.cargo/bin"
        state: present

    - name: Add OCaml opam to .zshrc
      ansible.builtin.lineinfile:
        path: ~/.zshrc
        line: "eval $(opam env)"
        state: present

    ##################################################
    #            Cloud Tools Setup                   #
    ##################################################

    - name: Remove Google Cloud SDK block from .zshrc
      ansible.builtin.blockinfile:
        path: ~/.zshrc
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Google Cloud SDK"
        state: absent

    - name: Add AWS CLI shell completion to .zshrc
      ansible.builtin.lineinfile:
        path: ~/.zshrc
        regexp: 'aws_completer" aws$'
        line: 'complete -C "/opt/homebrew/bin/aws_completer" aws'
        state: present

    - name: Ensure nvm directory exists
      ansible.builtin.file:
        path: ~/.nvm
        state: directory
        mode: "0755"

    ##################################################
    #                    Git                         #
    ##################################################

    - name: Set git user name
      community.general.git_config:
        name: user.name
        scope: global
        value: Max Yarmakovich

    - name: Install git-lfs filters
      ansible.builtin.command: git lfs install --skip-repo
      changed_when: false

    - name: Ensure global git config directory exists
      ansible.builtin.file:
        path: ~/.config/git
        state: directory
        mode: "0755"

    - name: Copy global gitignore
      ansible.builtin.copy:
        src: config/git-ignore
        dest: ~/.config/git/ignore
        mode: "0644"

    ##################################################
    #            Productivity tools                  #
    ##################################################

    - name: Configure middleclick for tap to click
      ansible.builtin.command: defaults write com.matthewlunsford.MiddleClick TapToClick -bool true
      register: middleclick_config
      changed_when: middleclick_config.rc != 0

    - name: Add MiddleClick to login items
      ansible.builtin.shell: |
        osascript -e 'tell application "System Events" to make login item at end with properties {path:"/Applications/MiddleClick.app", hidden:false}'
      register: add_login_item
      changed_when: add_login_item.rc != 0
      failed_when: add_login_item.rc != 0 and "already exists" not in add_login_item.stderr

    - name: Add Rectangle to login items
      ansible.builtin.shell: |
        osascript -e 'tell application "System Events" to make login item at end with properties {path:"/Applications/Rectangle.app", hidden:false}'
      register: add_rectangle_login_item
      changed_when: add_rectangle_login_item.rc != 0
      failed_when: add_rectangle_login_item.rc != 0 and "already exists" not in add_rectangle_login_item.stderr

    - name: Add Raycast to login items
      ansible.builtin.shell: |
        osascript -e 'tell application "System Events" to make login item at end with properties {path:"/Applications/Raycast.app", hidden:false}'
      register: add_raycast_login_item
      changed_when: add_raycast_login_item.rc != 0
      failed_when: add_raycast_login_item.rc != 0 and "already exists" not in add_raycast_login_item.stderr

    ##################################################
    #                Cursor IDE Setup                #
    ##################################################

    - name: Check if Cursor is installed
      ansible.builtin.command: cursor -v
      register: cursor_version
      ignore_errors: yes
      changed_when: false

    - name: Install Cursor if not present
      community.general.homebrew_cask:
        name: cursor
        state: present
      when: cursor_version.rc != 0

    - name: Get list of installed Cursor extensions
      ansible.builtin.command: cursor --list-extensions
      register: installed_extensions
      changed_when: false

    - name: Install Cursor extensions
      ansible.builtin.command: cursor --install-extension {{ item }}
      loop: "{{ cursor_extensions }}"
      when: item not in installed_extensions.stdout_lines
      ignore_errors: yes

    - name: Ensure Cursor settings directory exists
      ansible.builtin.file:
        path: "~/Library/Application Support/Cursor/User"
        state: directory
        mode: "0755"

    - name: Check if custom settings.json exists
      ansible.builtin.stat:
        path: "config/cursor-settings.json"
      register: custom_settings

    - name: Copy custom settings.json to Cursor config directory
      ansible.builtin.copy:
        src: "config/cursor-settings.json"
        dest: "~/Library/Application Support/Cursor/User/settings.json"
        mode: "0644"
      when: custom_settings.stat.exists

    - name: Copy Cursor keybindings
      ansible.builtin.copy:
        src: "config/cursor-keybindings.json"
        dest: "~/Library/Application Support/Cursor/User/keybindings.json"
        mode: "0644"

    ##################################################
    #              AI Agent Configs                  #
    ##################################################
    # App-managed configs (settings.json, config.toml, cli-config.json, mcp.json)
    # are only seeded when missing so re-runs don't clobber app-written state.

    - name: Ensure agent config directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - ~/.claude/commands
        - ~/.codex
        - ~/.cursor

    - name: Seed Claude Code settings
      ansible.builtin.copy:
        src: config/claude/settings.json
        dest: ~/.claude/settings.json
        mode: "0644"
        force: false

    - name: Copy Claude Code CLAUDE.md
      ansible.builtin.copy:
        src: config/claude/CLAUDE.md
        dest: ~/.claude/CLAUDE.md
        mode: "0644"

    - name: Copy Claude Code commands
      ansible.builtin.copy:
        src: config/claude/commands/
        dest: ~/.claude/commands/
        mode: "0644"

    - name: Seed Codex config
      ansible.builtin.template:
        src: config/codex/config.toml.j2
        dest: ~/.codex/config.toml
        mode: "0600"
        force: false

    - name: Add personal defaults to Codex AGENTS.md
      ansible.builtin.blockinfile:
        path: ~/.codex/AGENTS.md
        create: true
        block: "{{ lookup('file', 'config/codex/AGENTS.md') }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Personal defaults"
        insertafter: EOF

    - name: Seed Cursor agent CLI config
      ansible.builtin.copy:
        src: config/cursor-agent/cli-config.json
        dest: ~/.cursor/cli-config.json
        mode: "0644"
        force: false

    - name: Seed Cursor MCP servers
      ansible.builtin.copy:
        src: config/cursor-agent/mcp.json
        dest: ~/.cursor/mcp.json
        mode: "0600"
        force: false
